<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arc-79</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #03050b;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #e8ecf5;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  /* Invisible element used to read the phone's safe-area insets (notch, home bar). */
  #safe {
    position: fixed;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  /* ---- Start and summary screens ---- */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    background: rgba(3, 5, 11, 0.55);
    touch-action: manipulation;
    cursor: pointer;
  }
  .overlay.hidden { display: none; }
  .panel { width: 100%; max-width: 400px; text-align: center; }
  h1 {
    margin: 0 0 28px;
    font-size: clamp(44px, 14vw, 76px);
    letter-spacing: 0.14em;
    font-weight: 700;
    text-shadow: 0 0 18px rgba(232, 236, 245, 0.45);
  }
  .sub { margin: 4px 0 28px; opacity: 0.6; font-size: 14px; letter-spacing: 0.08em; }
  .rules { list-style: none; padding: 0; margin: 0 auto 36px; text-align: left; display: inline-block; font-size: 15px; line-height: 1.5; }
  .rules li { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; }
  .dot.white  { background: #e8ecf5; box-shadow: 0 0 8px #e8ecf5; }
  .dot.yellow { background: #FFDB78; box-shadow: 0 0 8px #FFDB78; }
  .dot.blue   { background: #00BABC; box-shadow: 0 0 8px #00BABC; }
  .note { font-size: 13px; opacity: 0.6; line-height: 1.5; margin: 0 0 30px; }
  .cta { font-size: 18px; letter-spacing: 0.2em; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  .summary .label { font-size: 13px; letter-spacing: 0.2em; opacity: 0.6; }
  .summary .score { font-size: clamp(48px, 16vw, 80px); font-weight: 700; margin: 4px 0 20px; text-shadow: 0 0 18px rgba(0, 186, 188, 0.5); color: #00BABC; }
  .summary table { margin: 0 auto 28px; border-collapse: collapse; font-size: 15px; }
  .summary td { padding: 5px 10px; text-align: left; }
  .summary td.n { text-align: right; font-weight: 700; }
  .summary tr.gap td { padding-top: 14px; }
  .summary td.pts { text-align: right; opacity: 0.5; }
  .summary td.pts:not(:empty)::before { content: "+"; }
  .caught { color: #00BABC; }
  .missed { opacity: 0.6; }
  .summary tr.bad { color: #ED4C4C; }
  .summary table.spaced { margin-top: 22px; }
  .health { letter-spacing: 0.15em; }
  .health .lost { opacity: 0.4; }
  .restored { font-size: 12px; color: #00BABC; margin-left: 6px; }   /* Pantone 2348 C (Rubin visual identity) */
  button {
    font: inherit;
    font-size: 17px;
    letter-spacing: 0.2em;
    color: #03050b;
    background: #e8ecf5;
    border: 0;
    border-radius: 6px;
    padding: 14px 28px;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(232, 236, 245, 0.35);
    touch-action: manipulation;
  }
  button:disabled { opacity: 0.3; }
  button.secondary {
    color: #e8ecf5;
    background: transparent;
    box-shadow: none;
    border: 1.5px solid rgba(232, 236, 245, 0.45);
  }

  /* ---- Pause and mute buttons (top centre, side by side, during play) ---- */
  .hud-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid rgba(232, 236, 245, 0.35);
    box-shadow: none;
    color: rgba(232, 236, 245, 0.75);
    font-size: 13px;
    letter-spacing: 0;
  }
  .hud-btn.hidden { display: none; }
  #pauseBtn { transform: translateX(calc(-100% - 6px)); }
  #muteBtn  { transform: translateX(6px); }
  #muteBtn svg { width: 18px; height: 18px; }
  #muteBtn .off, #muteBtn.muted .on { display: none; }
  #muteBtn.muted .off { display: block; }

  /* ---- Pause menu and About screen ---- */
  .menu { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 28px; }
  .menu button { min-width: 220px; }
  .label { font-size: 13px; letter-spacing: 0.2em; opacity: 0.6; }
  .about-link {
    display: inline-block;
    margin-top: 22px;
    padding: 8px 12px;           /* bigger tap area than the text */
    font-size: 13px;
    letter-spacing: 0.2em;
    color: rgba(232, 236, 245, 0.6);
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
  }
  #about { z-index: 10; background: #03050b; align-items: flex-start; overflow-y: auto; cursor: default; }
  #about .panel { text-align: left; margin: auto 0; }
  #about h2 { font-size: 22px; letter-spacing: 0.12em; margin: 0 0 18px; }
  #about p { font-size: 15px; line-height: 1.6; opacity: 0.85; margin: 0 0 14px; }
  #about .menu { margin-top: 28px; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="safe"></div>

<div id="title" class="overlay">
  <div class="panel">
    <h1>ARC-79</h1>
    <ul class="rules">
      <li><span class="dot white"></span>Tap a moving object to tag it</li>
      <li><span class="dot yellow"></span>Wait while it traces an arc</li>
      <li><span class="dot blue"></span>Tap it again to link it</li>
    </ul>
    <div class="cta">TAP TO START</div>
    <a class="about-link" data-about>ABOUT</a>
  </div>
</div>

<div id="summary" class="overlay hidden" style="cursor:default">
  <div class="panel summary" id="summaryPanel"></div>
</div>

<button id="pauseBtn" class="hud-btn hidden" aria-label="Pause">❚❚</button>
<button id="muteBtn" class="hud-btn hidden" aria-label="Mute">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
    <path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path class="off" d="M16 9l6 6M22 9l-6 6"/>
  </svg>
</button>

<div id="pause" class="overlay hidden" style="cursor:default">
  <div class="panel">
    <div class="label">PAUSED</div>
    <div class="menu">
      <button id="resumeBtn">RESUME</button>
      <button id="soundBtn" class="secondary">SOUND: ON</button>
      <button id="restartBtn" class="secondary">RESTART</button>
    </div>
  </div>
</div>

<!-- ==========================================================================
     ABOUT SCREEN: write the science notes here. Plain HTML: each paragraph
     in its own <p>...</p>. Links work too: <a href="https://...">text</a>
     ========================================================================== -->
<div id="about" class="overlay hidden">
  <div class="panel">
    <h2>ABOUT ARC-79</h2>
    <p>Science notes coming soon.</p>
    <div class="menu">
      <button id="aboutClose" class="secondary">BACK</button>
    </div>
  </div>
</div>

<noscript><p style="padding:24px">Arc-79 needs JavaScript.</p></noscript>

<script>
'use strict';

/* ==========================================================================
   CONFIG: every tunable number lives here.

   Units: distances and speeds are in SCREEN WIDTHS (1.0 = the full width of
   the window), so a phone and a desktop play alike. Speeds are screen widths
   per second, measured against the star field (not the screen). Times are in
   seconds.
   ========================================================================== */
const CONFIG = {
  // ---- The night ---------------------------------------------------------
  nightLength: 79,            // seconds in one night
  // (the calm opening's length is per night: `quietStart` in the nights table below)
  quietSpawnFactor: 0.2,      // spawn rate during the quiet start, as a fraction of baseline (0.2 × 0.9 ≈ 1 object every 5–6 s)
  firstObjectAt: 1.5,         // a guaranteed main-belt asteroid enters at this time, so there's something to learn on
  baseSpawnRate: 0.9,         // baseline objects per second (was 0.7: too quiet mid-night)
  rampLow: 0.8,               // spawn multiplier right after the quiet start
  rampHigh: 1.5,              // spawn multiplier at the end of the night
  rampExponent: 0.7,          // shape of the climb: 1 = straight line, below 1 = climbs early then levels off,
                              //   above 1 = holds back until late. At 0.7, about half the climb is done by 35 s.
                              //   Resulting rate: ≈0.7/s at 10 s, 1.0/s at 25 s, 1.1/s at 40 s, 1.2/s at 60 s, 1.35/s at the end
                              //   (on night 1; later nights multiply this by their `spawn` value below)

  // ---- The run: nights back to back until health runs out ----------------
  // Target: an average novice reaches game over during night 2 or 3 (~2.5–4 min),
  // like a classic arcade credit. Only missed near-Earth objects cost health.
  startHealth: 3,             // health at the start of a run
  maxHealth: 3,               // health can't be restored above this
  neoMissDamage: 1,           // health lost per missed near-Earth object
  cleanNightRestore: 1,       // health restored after a night with no misses

  // Difficulty per night. Night 1 uses the first row, night 2 the second, and
  // so on. Nights past the end of the table repeat the last row, plus
  // `afterTable` for each extra night.
  //   neos:        near-Earth objects that night
  //   spawn:       multiplier on the whole spawn curve (busier field = fuller buffer)
  //   neoSpeed:    multiplier on near-Earth object speed
  //   warningLead: seconds of warning before each near-Earth object enters
  //   quietStart:  seconds of calm at the start (night 1 needs it to learn; later nights barely pause)
  nights: [
    { neos: 1, spawn: 1.00, neoSpeed: 1.00, warningLead: 1.5, quietStart: 10 },
    { neos: 3, spawn: 1.25, neoSpeed: 1.10, warningLead: 1.2, quietStart: 3 },
    { neos: 3, spawn: 1.40, neoSpeed: 1.18, warningLead: 1.0, quietStart: 3 },   // + the guaranteed interstellar object
  ],
  afterTable: { neos: 1, spawn: 0.10, neoSpeed: 0.05, warningLead: -0.1 },
  maxNeosPerNight: 6,         // cap, however far a run goes
  minWarningLead: 0.6,        // floor on the warning, however far a run goes

  // ---- Alert buffer ------------------------------------------------------
  bufferSlots: 4,             // how many objects can be tagged at once

  // ---- Star field --------------------------------------------------------
  scrollTime: 40,             // seconds for a star at mid-screen to cross the screen, left to right
  fieldPivotBelow: 1.2,       // the field turns around a pole this far below the bottom edge, in screen widths.
                              //   Smaller = tighter arcs and a bigger speed difference top to bottom.
                              //   Set to a large number (e.g. 100) for a nearly straight scroll.
  starDensity: 170,           // background field stars per (screen width)²
  maxStars: 600,              // cap for very tall screens

  // ---- Core rule ---------------------------------------------------------
  arcDistance: 0.10,          // how far a tagged object must move against the stars to turn blue
  tapRadius: 0.05,            // tap forgiveness, as a fraction of screen width...
  tapRadiusMinPx: 24,         // ...but never smaller than this many pixels
  edgeMargin: 0.04,           // how far past the edge an object must go to count as gone

  // ---- Object mix (relative weights for random spawns) ------------------
  mix: { mainBelt: 0.77, comet: 0.08, star: 0.15 },

  // ---- Object types ------------------------------------------------------
  mainBelt: {
    speedMin: 0.035,          // slowest (≈2.9 s wait with arcDistance 0.10)
    speedMax: 0.067,          // fastest (≈1.5 s wait)
    curveChance: 0.4,         // share of asteroids that follow a curved (quadratic) path; the rest go straight
    curveMin: 0.04,           // gentlest sideways pull on a curved one, as a fraction of its speed per second
    curveMax: 0.10,           // strongest pull. At 0.10 its path bends about 45° over 10 s
    points: 10,
    size: 0.011, sizeMinPx: 7, sizeMaxPx: 14,   // drawn radius: fraction of width, clamped to pixels
  },
  comet: {
    speedMin: 0.0125,         // slowest (≈8 s wait)
    speedMax: 0.02,           // fastest (≈5 s wait)
    points: 30,
    size: 0.005, sizeMinPx: 2.5, sizeMaxPx: 5,  // nucleus radius
    tailDots: 9,              // number of dots in the pixel tail
    maxOnScreen: 2,           // comets linger (~40 s on screen), so never more than this many at once;
                              //   a comet spawn over the cap becomes an asteroid instead
  },
  neo: {                      // near-Earth object: the critical target
    speedMin: 0.22,           // crosses a screen width in ≈4.5 s
    speedMax: 0.28,
    arcDistance: 0.20,        // its own arc distance (overrides the global one): ≈0.7–0.9 s to turn blue
    minCrossTime: 3,          // its path is always on screen at least this long (re-rolled if a path is shorter)
    points: 90,
                              // (how many per night, and their warning, are in `nights` above)
    windowStart: 45,          // a night's only near-Earth object arrives between windowStart...
    windowEnd: 70,            // ...and windowEnd (pulled earlier if needed so it can finish crossing before the night ends)
    multiWindowStart: 18,     // with two or more, the window opens this early instead, so one comes early
    minSeparation: 4,         // seconds at least between two arrivals
    endBuffer: 1.5,           // it must be able to finish crossing this many seconds before the night ends
    centerBox: 0.3,           // its path always passes through the middle of the screen (0.3 = middle 40%)
    size: 0.012, sizeMinPx: 7, sizeMaxPx: 13,
  },
  iso: {                      // interstellar object: a rarer, faster critical target
    firstNight: 3,            // never appears before this night
    alwaysOnFirstNight: true, // every run that reaches firstNight meets one there
    chancePerNight: 0.4,      // chance of one on each later night (at most one a night)
    speedMin: 0.30,           // faster than a near-Earth object (also scaled by the night's neoSpeed)
    speedMax: 0.36,
    arcDistance: 0.20,        // ≈0.55–0.65 s to turn blue
    minCrossTime: 3,          // its path is always on screen at least this long
    points: 180,              // 2× a near-Earth object
    damage: 2,                // health lost if it gets away
    size: 0.012, sizeMinPx: 7, sizeMaxPx: 13,
  },
  star: {                     // variable star (the decoy): fixed to the star field, never turns blue
    clearTime: 20,            // seconds after tagging before it turns white again and frees its slot
    points: 0,
    flickerPeriodMin: 0.5,    // seconds per flicker, fastest
    flickerPeriodMax: 1.4,    // slowest
    fadeIn: 0.8,              // seconds to brighten into view
    size: 0.005, sizeMinPx: 2.5, sizeMaxPx: 4.5,
  },

  // ---- Look --------------------------------------------------------------
  linkFadeTime: 0.7,          // seconds a linked object takes to fade out
  showArcTrail: true,         // dotted line from the tag point to a tagged object, plus a progress ring
  showHints: true,            // short how-to lines above the buffer until the first link
  dawn: {
    enabled: true,            // the sky brightens toward the end of the night
    duration: 15,             // over the last this-many seconds
    starFade: 0.65,           // how much the field stars fade by the end (0 = none, 1 = gone)
  },
  colors: {
    sky: '#03050b',
    dawnSky: '#1d2742',
    fieldStar: '#cfd8ff',
    white: '#e8ecf5',
    yellow: '#FFDB78',       // Pantone 2004 C (Rubin visual identity)
    blue: '#00BABC',         // Rubin Turquoise (Rubin visual identity)
    red: '#ED4C4C',          // Pantone 2348 C (Rubin visual identity): health lost
  },

  // ---- Sound -------------------------------------------------------------
  // The good sounds (tag, blue, link) are notes from a major pentatonic
  // scale, so any mix of them is consonant. Each tagged object picks its own
  // note and keeps it: its blue chime is that note an octave up, and its link
  // run starts from it. The bad-news sounds sit outside the scale on purpose.
  // Frequencies are in Hz; phone speakers barely play anything below ~150 Hz.
  sound: {
    enabled: true,            // master switch for all sound
    volume: 0.6,              // master volume, 0 to 1
    key: 72,                  // root note of the scale as a MIDI number (72 = the C above middle C)
    keyStepPerNight: 5,       // each night moves the key up this many semitones (5 = a fourth: C, F, B♭, E♭...),
                              //   folded to stay within half an octave of the start. 0 = same key every night.
    scale: [0, 2, 4, 7, 9],   // major pentatonic: semitones above the root (C D E G A)
    tag:   { octave: 0, length: 0.09, volume: 0.30 },   // plucky single note
    ready: { octave: 1, length: 0.9,  volume: 0.18 },   // soft bell, an octave above its tag note
    link:  {
      octave: 0,              // the run starts on the object's own note, in this octave (0 = same as its tag)
      notes: { mainBelt: 2, comet: 3, neo: 5, iso: 7 }, // length of the rising run, by type
      gap: 0.065,             // seconds between notes in the run
      length: 0.35,           // how long each note rings
      volume: 0.24,
    },
    full:  { freq: 190, toFreq: 95, length: 0.12, volume: 0.45 },  // dull thud, pitch drops
    warn:  { high: 988, low: 740, beep: 0.16, volume: 0.16 },      // near-Earth: high-low pairs for the whole warning
    warnIso: { tones: [1319, 988, 740], beep: 0.11, volume: 0.16 }, // interstellar: falling triplets for the whole warning
    miss:  { freq: 330, toFreq: 110, length: 0.7, volume: 0.30 },  // low downward slide
    minGap: 0.08,             // blue chimes that land together are spaced at least this far apart (seconds)
  },

  // ---- Debug -------------------------------------------------------------
  debugTapRadius: false,      // draw the tap area around every object
};


/* ==========================================================================
   SOUND
   Generated with Web Audio: no audio files. It follows the phone's own
   silent switch and volume (we never override the silent switch), and the
   in-game mute silences it on top of that.
   Browsers only allow sound after a tap, so unlock() runs on the taps that
   start or resume a night.
   ========================================================================== */
const Sound = (() => {
  const S = CONFIG.sound;
  let actx = null;            // the AudioContext, created on the first tap
  let master = null;          // master volume
  let muted = false;          // in-game mute (resets when the page reloads)
  let lastNote = -1;          // last tag note, so two tags in a row differ
  let nextReadyAt = 0;        // earliest time the next blue chime may start
  let keyShift = 0;           // semitones tonight's key sits above S.key

  // Note number n counts up the pentatonic scale: 0-4 is the first octave,
  // 5-9 the next, and so on. Turn it into a frequency.
  function noteHz(n) {
    const octave = Math.floor(n / S.scale.length);
    const degree = ((n % S.scale.length) + S.scale.length) % S.scale.length;
    const midi = S.key + keyShift + 12 * octave + S.scale[degree];
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  const live = () => S.enabled && !muted && actx && actx.state === 'running';

  // One note: an oscillator through a gain envelope (fast attack, smooth
  // decay). toFreq slides the pitch over the note's length.
  function tone({ freq, toFreq, type = 'sine', at = 0, length, volume, attack = 0.005 }) {
    const t0 = actx.currentTime + at;
    const osc = actx.createOscillator();
    const env = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (toFreq) osc.frequency.exponentialRampToValueAtTime(toFreq, t0 + length);
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(volume, t0 + attack);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
    osc.connect(env);
    env.connect(master);
    osc.start(t0);
    osc.stop(t0 + length + 0.05);
  }

  return {
    unlock() {
      if (!S.enabled) return;
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = S.volume;
        master.connect(actx.destination);
      }
      if (actx.state !== 'running') actx.resume();
    },

    // Each night is in a different key.
    setNight(n) {
      const k = ((n - 1) * S.keyStepPerNight) % 12;
      keyShift = k > 6 ? k - 12 : k;
    },

    get muted() { return muted; },
    setMuted(m) {
      muted = m;
      if (master) master.gain.value = m ? 0 : S.volume;   // also cuts notes already playing
    },

    // First tag: pick this object's note (one no other tracked object is
    // using, if possible) and play it as a short pluck.
    tag(o) {
      const taken = slots.filter(s => s && s !== o && s.note !== undefined).map(s => s.note);
      const base = S.tag.octave * S.scale.length;
      let choices = [];
      for (let i = 0; i < S.scale.length; i++) {
        const n = base + i;
        if (n !== lastNote && !taken.includes(n)) choices.push(n);
      }
      if (!choices.length) choices = [base + Math.floor(Math.random() * S.scale.length)];
      o.note = choices[Math.floor(Math.random() * choices.length)];
      lastNote = o.note;
      if (!live()) return;
      tone({ freq: noteHz(o.note), type: 'triangle', length: S.tag.length, volume: S.tag.volume });
    },

    // Turning blue: its note an octave up, as a soft bell (a pure tone plus
    // a quieter, faster-fading overtone). Spaced out if several land at once.
    ready(o) {
      if (!live()) return;
      const now = actx.currentTime;
      const at = Math.max(0, nextReadyAt - now);
      nextReadyAt = now + at + S.minGap;
      const f = noteHz((o.note ?? 0) + (S.ready.octave - S.tag.octave) * S.scale.length);
      tone({ freq: f, at, length: S.ready.length, volume: S.ready.volume, attack: 0.01 });
      tone({ freq: f * 3, at, length: S.ready.length * 0.4, volume: S.ready.volume * 0.25, attack: 0.01 });
    },

    // Link: a quick rising run up the scale from its note. Longer runs for
    // rarer objects.
    link(o) {
      if (!live()) return;
      const steps = S.link.notes[o.type] ?? 2;
      const start = (o.note ?? 0) + (S.link.octave - S.tag.octave) * S.scale.length;
      for (let i = 0; i < steps; i++) {
        const f = noteHz(start + i);
        const last = i === steps - 1;
        const len = last ? S.link.length * 1.6 : S.link.length;   // the top note rings on
        tone({ freq: f, type: 'square', at: i * S.link.gap, length: len, volume: S.link.volume * 0.35 });
        tone({ freq: f, type: 'triangle', at: i * S.link.gap, length: len, volume: S.link.volume });
      }
    },

    // Full buffer: a short, dull drop in pitch.
    full() {
      if (!live()) return;
      tone({ freq: S.full.freq, toFreq: S.full.toFreq, type: 'square', length: S.full.length, volume: S.full.volume * 0.5 });
      tone({ freq: S.full.freq, toFreq: S.full.toFreq, type: 'triangle', length: S.full.length, volume: S.full.volume });
    },

    // Near-Earth object incoming: high-low beeps for the whole warning lead.
    warn(lead, type) {
      if (!live()) return;
      if (type === 'iso') {
        const w = S.warnIso;
        const count = Math.max(3, Math.round(lead / w.beep));
        for (let i = 0; i < count; i++) {
          tone({ freq: w.tones[i % w.tones.length], type: 'square', at: i * w.beep, length: w.beep * 0.8, volume: w.volume });
        }
        return;
      }
      const w = S.warn;
      const pairs = Math.max(1, Math.round(lead / (w.beep * 2)));
      for (let i = 0; i < pairs * 2; i++) {
        tone({ freq: i % 2 ? w.low : w.high, type: 'square', at: i * w.beep, length: w.beep * 0.85, volume: w.volume });
      }
    },

    // Near-Earth object missed: a low note sliding down.
    miss() {
      if (!live()) return;
      const m = S.miss;
      tone({ freq: m.freq, toFreq: m.toFreq, type: 'sawtooth', length: m.length, volume: m.volume * 0.4, attack: 0.02 });
      tone({ freq: m.freq, toFreq: m.toFreq, type: 'triangle', length: m.length, volume: m.volume, attack: 0.02 });
    },
  };
})();


/* ==========================================================================
   HELPERS
   ========================================================================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function pickWeighted(weights) {
  let total = 0;
  for (const k in weights) total += weights[k];
  let r = Math.random() * total;
  for (const k in weights) {
    r -= weights[k];
    if (r <= 0) return k;
  }
  return Object.keys(weights)[0];
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
}

// A drawn size from a type's config: fraction of width, clamped to pixels.
function sizePx(cfg) { return clamp(cfg.size * W, cfg.sizeMinPx, cfg.sizeMaxPx); }

function font(px, weight = 600) {
  return `${weight} ${px}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
}


/* ==========================================================================
   CANVAS AND SCREEN SIZE
   ========================================================================== */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const safeProbe = document.getElementById('safe');

let W = 0, H = 0, DPR = 1;                       // CSS pixel size of the window
const safe = { top: 0, right: 0, bottom: 0, left: 0 }; // phone notch / home-bar insets

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const cs = getComputedStyle(safeProbe);
  safe.top = parseFloat(cs.paddingTop) || 0;
  safe.right = parseFloat(cs.paddingRight) || 0;
  safe.bottom = parseFloat(cs.paddingBottom) || 0;
  safe.left = parseFloat(cs.paddingLeft) || 0;

  seedFieldStars();
}


/* ==========================================================================
   SKY COORDINATES AND CAMERA
   Everything (stars, objects, tag points) lives in fixed sky coordinates,
   measured in screen widths. The camera slides and turns slowly across the
   sky, which is what makes the field scroll. Because tag points are stored
   in sky coordinates, "distance moved since tagging" is automatically
   measured against the stars, not the screen.
   ========================================================================== */
const cam = { x: 0, y: 0, a: 0 };   // sky position at the screen centre, and turn angle

function skyToScreen(x, y) {
  const dx = x - cam.x, dy = y - cam.y;
  const c = Math.cos(cam.a), s = Math.sin(cam.a);
  return { x: W / 2 + (c * dx + s * dy) * W, y: H / 2 + (-s * dx + c * dy) * W };
}
function screenToSky(px, py) {
  const rx = (px - W / 2) / W, ry = (py - H / 2) / W;
  const c = Math.cos(cam.a), s = Math.sin(cam.a);
  return { x: cam.x + c * rx - s * ry, y: cam.y + s * rx + c * ry };
}
// Turn a direction expressed in screen orientation into sky orientation, and back.
function screenDirToSky(ux, uy) {
  const c = Math.cos(cam.a), s = Math.sin(cam.a);
  return { x: c * ux - s * uy, y: s * ux + c * uy };
}
function skyDirToScreen(vx, vy) {
  const c = Math.cos(cam.a), s = Math.sin(cam.a);
  return { x: c * vx + s * vy, y: -s * vx + c * vy };
}

// The field's on-screen drift speed at mid-screen, in screen widths per second.
const fieldSpeed = () => 1 / CONFIG.scrollTime;

// The whole field turns around a pole below the screen, like the sky turning
// around the celestial pole. Distance from the pole to the screen centre:
const poleDistance = () => CONFIG.fieldPivotBelow + H / W / 2;
// ...and the turn rate (radians per second) that gives fieldSpeed at mid-screen.
const fieldTurnRate = () => fieldSpeed() / poleDistance();

// On-screen velocity of the field at screen point (x, y), in screen widths
// (origin top-left). Stars above mid-screen move faster, stars below slower,
// and the left side drifts up while the right side drifts down.
function fieldVelAt(x, y) {
  const w = fieldTurnRate();
  return { x: fieldSpeed() - w * (y - H / W / 2), y: w * (x - 0.5) };
}

function updateCamera(dt) {
  // Slide the camera "left" in its own frame while turning it. Together these
  // swing the view around the pole below the screen.
  const c = Math.cos(cam.a), s = Math.sin(cam.a);
  cam.x -= c * fieldSpeed() * dt;
  cam.y -= s * fieldSpeed() * dt;
  cam.a -= fieldTurnRate() * dt;
}


/* ==========================================================================
   STAR FIELD
   ========================================================================== */
let fieldStars = [];

function newFieldStar(px, py) {
  const p = screenToSky(px, py);
  const r = Math.random();
  return {
    x: p.x, y: p.y,
    b: 0.15 + 0.85 * r * r * r,              // brightness: mostly faint, a few bright
    size: r > 0.93 ? 2 : r > 0.6 ? 1.5 : 1,
    tw: rand(0, TAU), twSpeed: rand(0.5, 2), // gentle twinkle
  };
}

function seedFieldStars() {
  const n = Math.min(CONFIG.maxStars, Math.round(CONFIG.starDensity * H / W));
  fieldStars = [];
  for (let i = 0; i < n; i++) fieldStars.push(newFieldStar(rand(0, W), rand(0, H)));
}

// A field star that drifts off screen is recycled: pick a random point on
// screen, then wind it backwards around the pole until it is just off screen.
// It drifts back in from wherever the turning field brings stars in.
function recycledFieldStar() {
  const px = rand(0, W), py = rand(0, H);
  const poleX = W / 2, poleY = H / 2 + poleDistance() * W;
  let dx = px - poleX, dy = py - poleY;
  const step = 6 / Math.hypot(dx, dy);          // ~6 px per step
  const c = Math.cos(step), s = Math.sin(step);
  for (let i = 0; i < 1000; i++) {
    const x = poleX + dx, y = poleY + dy;
    if (x < 0 || x > W || y < 0 || y > H) return newFieldStar(x, y);
    [dx, dy] = [dx * c + dy * s, -dx * s + dy * c];  // one step backwards
  }
  return newFieldStar(px, py);
}

function updateFieldStars() {
  const m = 12;
  for (let i = 0; i < fieldStars.length; i++) {
    const p = skyToScreen(fieldStars[i].x, fieldStars[i].y);
    if (p.x < -m || p.x > W + m || p.y < -m || p.y > H + m) {
      fieldStars[i] = recycledFieldStar();
    }
  }
}


/* ==========================================================================
   GAME STATE
   ========================================================================== */
let mode = 'title';        // 'title' | 'playing' | 'paused' | 'summary' | 'gameover'
let clock = 0;             // real seconds since page load (for animation)
let run = null;            // the current run: health and totals across nights
let night = null;          // the current night: its clock, difficulty and plan
let stats = null;          // what happened this night
let objects = [];          // everything tappable on screen
let slots = [];            // the alert buffer: one entry per slot, null or an object
let popups = [];           // floating "+10" texts
let banners = [];          // short centre-screen messages
let pipShake = 0;          // buffer shake after a tap with no free slot (1 → 0)
let damageFlash = 0;       // red edge flash after losing health (1 → 0)
let hintStage = 0;         // 0 tag, 1 wait, 2 link, 3 done
let nextId = 1;

// Difficulty for night n, from CONFIG.nights (and CONFIG.afterTable past its end).
function nightDifficulty(n) {
  const table = CONFIG.nights;
  const d = { ...table[Math.min(n, table.length) - 1] };
  const extra = n - table.length;
  if (extra > 0) {
    const g = CONFIG.afterTable;
    d.neos += g.neos * extra;
    d.spawn += g.spawn * extra;
    d.neoSpeed += g.neoSpeed * extra;
    d.warningLead += g.warningLead * extra;
  }
  d.neos = Math.min(Math.round(d.neos), CONFIG.maxNeosPerNight);
  d.warningLead = Math.max(d.warningLead, CONFIG.minWarningLead);
  return d;
}

function makeNight(number) {
  const diff = nightDifficulty(number);
  return {
    number,
    diff,
    t: 0,                  // seconds into the night
    firstSpawned: false,
    criticals: planCriticals(diff, number),   // near-Earth and interstellar objects, in arrival order
    gameOverIn: null,      // counts down to the game-over screen once health hits zero
  };
}

function newStats() {
  return {
    score: 0,
    linked: { mainBelt: 0, comet: 0, neo: 0, iso: 0 },
    lost: 0,               // tagged objects that left the field before linking
    starsTagged: 0,
    neoCaught: 0,
    neoMissed: 0,
    isoCaught: 0,
    isoMissed: 0,
    restored: 0,           // health given back at the end of a clean night
  };
}

// A run is nights back to back until health runs out.
function startRun() {
  run = {
    health: CONFIG.startHealth,
    score: 0,              // points from finished nights (the HUD adds the current night)
    nightsCompleted: 0,
    neoCaught: 0,
    neoMissed: 0,
    isoCaught: 0,
    isoMissed: 0,
  };
  startNight(1);
}

function startNight(number) {
  Sound.unlock();
  Sound.setNight(number);
  night = makeNight(number);
  stats = newStats();
  objects = [];
  slots = new Array(CONFIG.bufferSlots).fill(null);
  popups = [];
  banners = [];
  pipShake = 0;
  damageFlash = 0;
  hintStage = number === 1 ? 0 : 3;     // how-to hints on the first night only
  if (number > 1) addBanner(`NIGHT ${number}`, 3);   // no hint of how many critical targets are coming
  mode = 'playing';
  titleEl.classList.add('hidden');
  summaryEl.classList.add('hidden');
  pauseEl.classList.add('hidden');
  setHudButtons(true);
}

// Fold this night's numbers into the run.
function addNightToRun() {
  run.score += stats.score;
  run.neoCaught += stats.neoCaught;
  run.neoMissed += stats.neoMissed;
  run.isoCaught += stats.isoCaught;
  run.isoMissed += stats.isoMissed;
}

// The night ran its full length: a clean night restores health, then the summary.
function endNight() {
  addNightToRun();
  run.nightsCompleted++;
  if (stats.neoMissed + stats.isoMissed === 0 && run.health < CONFIG.maxHealth) {
    stats.restored = Math.min(CONFIG.cleanNightRestore, CONFIG.maxHealth - run.health);
    run.health += stats.restored;
  }
  mode = 'summary';
  objects = [];
  slots.fill(null);
  setHudButtons(false);
  showSummary();
}

// Health ran out.
function gameOver() {
  addNightToRun();
  mode = 'gameover';
  objects = [];
  slots.fill(null);
  setHudButtons(false);
  showGameOver();
}

// Back to the start screen, dropping the current run.
function goToTitle() {
  mode = 'title';
  run = null;
  objects = [];
  slots.fill(null);
  pauseEl.classList.add('hidden');
  setHudButtons(false);
  summaryEl.classList.add('hidden');
  titleEl.classList.remove('hidden');
}

// Pausing freezes everything, the star field included, so nothing drifts.
function pauseGame() {
  if (mode !== 'playing') return;
  mode = 'paused';
  setHudButtons(false);
  pauseEl.classList.remove('hidden');
}
function resumeGame() {
  if (mode !== 'paused') return;
  Sound.unlock();          // phones suspend audio in the background; resume on this tap
  mode = 'playing';
  pauseEl.classList.add('hidden');
  setHudButtons(true);
}


/* ==========================================================================
   SPAWNING
   ========================================================================== */

// Spawn rate at time t: quiet opening, then a climb from rampLow to rampHigh,
// all scaled by tonight's difficulty.
function spawnRate(t) {
  const c = CONFIG;
  const nightScale = night ? night.diff.spawn : 1;
  const quiet = night ? night.diff.quietStart : 10;
  if (t < quiet) return c.baseSpawnRate * c.quietSpawnFactor * nightScale;
  const p = clamp((t - quiet) / (c.nightLength - quiet), 0, 1);
  return c.baseSpawnRate * nightScale * (c.rampLow + (c.rampHigh - c.rampLow) * Math.pow(p, c.rampExponent));
}

// Time for a point at (x, y) moving at (vx, vy) to pass the screen edge plus
// margin. Units are screen widths; h is the screen height in widths.
function timeToEdge(x, y, vx, vy, m, h) {
  let t = Infinity;
  if (vx > 0) t = Math.min(t, (1 + m - x) / vx);
  else if (vx < 0) t = Math.min(t, (x + m) / -vx);
  if (vy > 0) t = Math.min(t, (h + m - y) / vy);
  else if (vy < 0) t = Math.min(t, (y + m) / -vy);
  return t;
}

// Plan a path across the screen for an object moving at (vsx, vsy) against
// the stars (in screen orientation): pick a point inside the field, work out
// what the eye sees there (its own motion plus the field's), then trace back
// to just outside the edge. The trace is straight, so for slow objects the
// entry point is approximate; they still drift in.
// `inner` keeps the chosen point away from the edges (0.15 = middle 70%).
function planEntry(vsx, vsy, inner) {
  const h = H / W, m = CONFIG.edgeMargin;
  const tx = rand(inner, 1 - inner);
  const ty = rand(inner * h, (1 - inner) * h);
  const f = fieldVelAt(tx, ty);
  let ux = vsx + f.x, uy = vsy + f.y;            // what the eye sees
  if (Math.hypot(ux, uy) < 1e-4) { ux = f.x; uy = f.y; }
  const back = timeToEdge(tx, ty, -ux, -uy, m, h);
  const fwd = timeToEdge(tx, ty, ux, uy, m, h);
  return { ex: tx - ux * back, ey: ty - uy * back, ux, uy, crossTime: back + fwd };
}

function makeObject(type, x, y, vx, vy) {
  return {
    id: nextId++, type,
    x, y, vx, vy, ax: 0, ay: 0,   // sky position, velocity and acceleration
    state: 'unknown',             // 'unknown' | 'tagged' | 'ready' | 'linked'
    age: 0,
    entered: false,               // has it been fully on screen yet?
    alpha: 1,
    tagX: 0, tagY: 0, tagTime: 0, // where and when it was tagged (sky coords)
    flash: 0,                     // ring pulse after tagging / turning blue (1 → 0)
    fade: 0,                      // link fade-out progress (0 → 1)
    removed: false,
  };
}

// A mover enters from whichever edge its path comes from. Its sky velocity
// is random in direction; what you see on screen is that plus the field drift.
function spawnMover(type, speed, inner) {
  const ang = rand(0, TAU);
  const vsx = Math.cos(ang) * speed, vsy = Math.sin(ang) * speed;  // vs stars, screen orientation
  const e = planEntry(vsx, vsy, inner);
  const p = screenToSky(e.ex * W, e.ey * W);
  const v = screenDirToSky(vsx, vsy);
  return makeObject(type, p.x, p.y, v.x, v.y);
}

function spawnMainBelt() {
  const c = CONFIG.mainBelt;
  const speed = rand(c.speedMin, c.speedMax);
  const o = spawnMover('mainBelt', speed, 0.15);
  if (Math.random() < c.curveChance) {
    // Constant sideways pull gives a gentle quadratic curve.
    const k = rand(c.curveMin, c.curveMax) * (Math.random() < 0.5 ? -1 : 1);   // bends left or right
    o.ax = -o.vy * k;
    o.ay = o.vx * k;
  }
  // A lumpy rock outline, Asteroids-style.
  const n = 8 + Math.floor(Math.random() * 3);
  o.shape = [];
  for (let i = 0; i < n; i++) o.shape.push(rand(0.68, 1.0));
  o.rot = rand(0, TAU);
  o.spin = rand(-0.8, 0.8);
  objects.push(o);
}

function spawnComet() {
  const c = CONFIG.comet;
  const o = spawnMover('comet', rand(c.speedMin, c.speedMax), 0.15);
  o.tailJitter = [];
  for (let i = 0; i < c.tailDots; i++) o.tailJitter.push(rand(-1, 1));
  objects.push(o);
}

// Variable stars brighten into view anywhere on the field, then ride with
// the stars until they scroll off the right edge.
function spawnStar() {
  const c = CONFIG.star;
  const p = screenToSky(rand(0.05, 0.75) * W, rand(0.08, 0.9) * H);
  const o = makeObject('star', p.x, p.y, 0, 0);
  o.entered = true;
  o.alpha = 0;
  o.flickerPeriod = rand(c.flickerPeriodMin, c.flickerPeriodMax);
  o.flickerPhase = rand(0, TAU);
  objects.push(o);
}

function spawnRandom() {
  const type = pickWeighted(CONFIG.mix);
  if (type === 'mainBelt') spawnMainBelt();
  else if (type === 'comet') {
    const comets = objects.filter(o => o.type === 'comet' && o.state !== 'linked').length;
    if (comets < CONFIG.comet.maxOnScreen) spawnComet(); else spawnMainBelt();
  }
  else if (type === 'star') spawnStar();
}


/* ==========================================================================
   CRITICAL TARGETS (near-Earth objects)
   Arrival times are picked at the start of the night. The path is picked
   when the warning starts, so the warning marker points at the real entry.
   ========================================================================== */
// Spread tonight's near-Earth objects across their window: one per equal
// slice of it, at a random point inside each slice, never closer together
// than minSeparation. With only one, it comes in the back half of the night.
function planCriticals(diff, number) {
  const c = CONFIG.neo;
  const types = new Array(diff.neos).fill('neo');
  // From firstNight on, sometimes one interstellar object joins, at a random place in the order.
  const iso = CONFIG.iso;
  const guaranteed = number === iso.firstNight && iso.alwaysOnFirstNight;
  if (number >= iso.firstNight && (guaranteed || Math.random() < iso.chancePerNight)) {
    types.splice(Math.floor(Math.random() * (types.length + 1)), 0, 'iso');
  }
  const n = types.length;
  // Slowest possible crossing on this screen shape, corner to corner.
  // (The field can push against it, so take its slowest speed minus the field's.)
  const worstCross = (Math.hypot(1, H / W) + 2 * CONFIG.edgeMargin) / (c.speedMin * diff.neoSpeed - 2 * fieldSpeed());
  const latest = Math.min(c.windowEnd, CONFIG.nightLength - worstCross - c.endBuffer);
  const first = Math.max(diff.warningLead, n === 1 ? c.windowStart : c.multiWindowStart);
  const start = Math.min(first, latest);
  const slice = (latest - start) / n;
  const list = [];
  let prev = -Infinity;
  for (let i = 0; i < n; i++) {
    let arrive = start + slice * (i + rand(0.15, 0.85));
    arrive = Math.min(latest, Math.max(arrive, prev + c.minSeparation));
    prev = arrive;
    list.push({ type: types[i], arrive, warnAt: arrive - diff.warningLead, path: null, spawned: false });
  }
  return list;
}

const CRITICAL_NAME = { neo: 'NEAR-EARTH OBJECT', iso: 'INTERSTELLAR OBJECT' };
const isCritical = o => o.type === 'neo' || o.type === 'iso';

// Pick a path through the middle of the screen. Paths shorter than
// minCrossTime (e.g. straight down a short landscape screen) are re-rolled,
// so there is always time to tag it, watch it turn blue and link it.
function planCriticalPath(crit) {
  const c = CONFIG[crit.type];
  let best = null;
  for (let i = 0; i < 40; i++) {
    const speed = rand(c.speedMin, c.speedMax) * night.diff.neoSpeed;
    const ang = rand(0, TAU);
    const vsx = Math.cos(ang) * speed, vsy = Math.sin(ang) * speed;
    const path = { vsx, vsy, ...planEntry(vsx, vsy, CONFIG.neo.centerBox) };
    if (!best || path.crossTime > best.crossTime) best = path;
    if (path.crossTime >= c.minCrossTime) break;
  }
  crit.path = best;
}

function spawnCritical(crit) {
  const p = screenToSky(crit.path.ex * W, crit.path.ey * W);
  const v = screenDirToSky(crit.path.vsx, crit.path.vsy);
  objects.push(makeObject(crit.type, p.x, p.y, v.x, v.y));
}

function updateCriticals() {
  for (const crit of night.criticals) {
    if (!crit.path && night.t >= crit.warnAt) {
      planCriticalPath(crit);
      Sound.warn(night.diff.warningLead, crit.type);
      addBanner(`${CRITICAL_NAME[crit.type]} INBOUND`, night.diff.warningLead + 1.2);
    }
    if (!crit.spawned && night.t >= crit.arrive) {
      if (!crit.path) planCriticalPath(crit);
      spawnCritical(crit);
      crit.spawned = true;
    }
  }
}


/* ==========================================================================
   BUFFER, TAGGING AND LINKING
   ========================================================================== */
function takeSlot(o) {
  const i = slots.indexOf(null);
  if (i < 0) return false;
  slots[i] = o;
  return true;
}
function freeSlot(o) {
  const i = slots.indexOf(o);
  if (i >= 0) slots[i] = null;
}

// Each type's config block, and its points and arc distance (a type can override the global arc).
const TYPE_CFG = { mainBelt: CONFIG.mainBelt, comet: CONFIG.comet, neo: CONFIG.neo, iso: CONFIG.iso, star: CONFIG.star };
const pointsFor = o => TYPE_CFG[o.type].points;
const arcFor = o => TYPE_CFG[o.type].arcDistance ?? CONFIG.arcDistance;

function tagObject(o) {
  if (!takeSlot(o)) {
    Sound.full();
    pipShake = 1;
    return;
  }
  o.state = 'tagged';
  o.tagX = o.x;
  o.tagY = o.y;
  o.tagTime = night.t;
  o.flash = 1;
  if (o.type === 'star') stats.starsTagged++;
  if (hintStage === 0) hintStage = 1;
  Sound.tag(o);
}

function linkObject(o) {
  o.state = 'linked';
  o.fade = 0;
  freeSlot(o);
  const pts = pointsFor(o);
  stats.score += pts;
  if (stats.linked[o.type] !== undefined) stats.linked[o.type]++;
  if (o.type === 'neo') stats.neoCaught++;
  if (o.type === 'iso') stats.isoCaught++;
  if (isCritical(o)) addBanner(`${CRITICAL_NAME[o.type]} CATALOGED`, 2);
  const s = skyToScreen(o.x, o.y);
  popups.push({ x: s.x, y: s.y, text: `+${pts}`, t: 0 });
  if (hintStage === 2) hintStage = 3;
  Sound.link(o);
}

// An object left the field. Tagged objects free their slot; real objects
// count as lost tracks; a near-Earth object that wasn't linked is a miss.
function objectLeft(o) {
  if (o.state === 'tagged' || o.state === 'ready') {
    freeSlot(o);
    if (o.type !== 'star') stats.lost++;
  }
  if (isCritical(o) && o.state !== 'linked') {
    if (o.type === 'neo') stats.neoMissed++;
    else stats.isoMissed++;
    loseHealth(o.type === 'iso' ? CONFIG.iso.damage : CONFIG.neoMissDamage);
    addBanner(`${CRITICAL_NAME[o.type]} MISSED`, 2);
    Sound.miss();
  }
  o.removed = true;
}

// Health only drops from missed critical targets. At zero the night stops
// shortly after (time to see what happened), then the game-over screen.
function loseHealth(amount) {
  run.health = Math.max(0, run.health - amount);
  damageFlash = 1;
  if (run.health === 0 && night.gameOverIn === null) {
    night.gameOverIn = 1.4;
    addBanner('GAME OVER', 2);
  }
}

function tapRadiusPx() { return Math.max(CONFIG.tapRadius * W, CONFIG.tapRadiusMinPx); }

// A tap links the nearest blue object in range; failing that it tags the
// nearest white one. Yellow objects and empty sky ignore taps.
function handleTap(px, py) {
  if (night.gameOverIn !== null) return;    // no more play once health is gone
  const r = tapRadiusPx();
  let ready = null, readyD = Infinity, fresh = null, freshD = Infinity;
  for (const o of objects) {
    if (o.removed || !o.entered) continue;
    const s = skyToScreen(o.x, o.y);
    const d = Math.hypot(s.x - px, s.y - py);
    if (d > r) continue;
    if (o.state === 'ready' && d < readyD) { ready = o; readyD = d; }
    else if (o.state === 'unknown' && o.alpha > 0.5 && d < freshD) { fresh = o; freshD = d; }
  }
  if (ready) linkObject(ready);
  else if (fresh) tagObject(fresh);
}


/* ==========================================================================
   UPDATE
   ========================================================================== */
function updateObject(o, dt) {
  o.age += dt;
  o.vx += o.ax * dt;
  o.vy += o.ay * dt;
  o.x += o.vx * dt;
  o.y += o.vy * dt;
  if (o.rot !== undefined) o.rot += o.spin * dt;
  o.flash = Math.max(0, o.flash - dt * 2);

  if (o.type === 'star' && o.state === 'unknown') {
    o.alpha = Math.min(1, o.alpha + dt / CONFIG.star.fadeIn);
  }

  // Tagged → ready once it has moved the arc distance against the stars.
  if (o.state === 'tagged' && o.type !== 'star') {
    if (Math.hypot(o.x - o.tagX, o.y - o.tagY) >= arcFor(o)) {
      o.state = 'ready';
      o.flash = 1;
      if (hintStage === 1) hintStage = 2;
      Sound.ready(o);
    }
  }

  // A tagged decoy never turns blue; after a while it clears and frees its slot.
  if (o.state === 'tagged' && o.type === 'star' && night.t - o.tagTime >= CONFIG.star.clearTime) {
    o.state = 'unknown';
    freeSlot(o);
  }

  if (o.state === 'linked') {
    o.fade += dt / CONFIG.linkFadeTime;
    if (o.fade >= 1) o.removed = true;
    return;
  }

  // Edge checks.
  const s = skyToScreen(o.x, o.y);
  const m = CONFIG.edgeMargin * W;
  const onScreen = s.x >= 0 && s.x <= W && s.y >= 0 && s.y <= H;
  if (onScreen) o.entered = true;
  const gone = s.x < -m || s.x > W + m || s.y < -m || s.y > H + m;
  if (gone && o.entered) objectLeft(o);
  else if (!o.entered && o.age > 30) o.removed = true;   // never made it in; drop quietly
}

function updateNight(dt) {
  night.t += dt;

  // Spawning: one guaranteed early asteroid, then random arrivals.
  if (!night.firstSpawned && night.t >= CONFIG.firstObjectAt) {
    spawnMainBelt();
    night.firstSpawned = true;
  }
  if (Math.random() < spawnRate(night.t) * dt) spawnRandom();
  updateCriticals();

  for (const o of objects) updateObject(o, dt);
  objects = objects.filter(o => !o.removed);

  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 1.1);
  for (const b of banners) b.t += dt;
  banners = banners.filter(b => b.t < b.dur);
  pipShake = Math.max(0, pipShake - dt * 2.5);
  damageFlash = Math.max(0, damageFlash - dt * 1.5);

  if (night.gameOverIn !== null) {
    night.gameOverIn -= dt;
    if (night.gameOverIn <= 0) gameOver();
  } else if (night.t >= CONFIG.nightLength) {
    endNight();
  }
}

function addBanner(text, dur) {
  banners = banners.filter(b => b.text !== text);
  banners.push({ text, t: 0, dur });
}


/* ==========================================================================
   DRAWING
   ========================================================================== */
const C = CONFIG.colors;

function stateColor(o) {
  if (o.state === 'tagged') return C.yellow;
  if (o.state === 'ready' || o.state === 'linked') return C.blue;
  return C.white;
}

// How far into dawn we are (0 = night, 1 = full dawn).
function dawnAmount() {
  const d = CONFIG.dawn;
  if (!d.enabled || (mode !== 'playing' && mode !== 'paused')) return 0;
  return clamp((night.t - (CONFIG.nightLength - d.duration)) / d.duration, 0, 1);
}

function drawSky() {
  const dawn = dawnAmount();
  ctx.fillStyle = dawn > 0 ? mixHex(C.sky, C.dawnSky, dawn) : C.sky;
  ctx.fillRect(0, 0, W, H);

  const fade = 1 - CONFIG.dawn.starFade * dawn;
  ctx.fillStyle = C.fieldStar;
  for (const s of fieldStars) {
    const p = skyToScreen(s.x, s.y);
    const a = s.b * (0.85 + 0.15 * Math.sin(s.tw + clock * s.twSpeed)) * fade;
    ctx.globalAlpha = a;
    ctx.fillRect(p.x - s.size / 2, p.y - s.size / 2, s.size, s.size);
    if (s.size >= 2) {               // soft halo on the brightest stars
      ctx.globalAlpha = a * 0.15;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// Dotted line from the tag point (which moves with the stars) to the object,
// plus a ring around a yellow object that fills as it traces its arc.
function drawArcTrail(o, s, r) {
  if (!CONFIG.showArcTrail || o.type === 'star') return;
  if (o.state !== 'tagged' && o.state !== 'ready') return;
  const t = skyToScreen(o.tagX, o.tagY);
  const col = stateColor(o);
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.45;
  ctx.setLineDash([2, 4]);
  ctx.beginPath();
  ctx.moveTo(t.x, t.y);
  ctx.lineTo(s.x, s.y);
  ctx.stroke();
  ctx.setLineDash([]);
  // small cross where it was tagged
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.moveTo(t.x - 3, t.y - 3); ctx.lineTo(t.x + 3, t.y + 3);
  ctx.moveTo(t.x + 3, t.y - 3); ctx.lineTo(t.x - 3, t.y + 3);
  ctx.stroke();
  if (o.state === 'tagged') {
    const prog = clamp(Math.hypot(o.x - o.tagX, o.y - o.tagY) / arcFor(o), 0, 1);
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r + 7, -Math.PI / 2, -Math.PI / 2 + prog * TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function drawMainBelt(o, s, r, col) {
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const n = o.shape.length;
  for (let i = 0; i <= n; i++) {
    const a = o.rot + (i % n) / n * TAU;
    const rr = r * o.shape[i % n];
    const x = s.x + Math.cos(a) * rr, y = s.y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawComet(o, s, r, col) {
  // Tail trails behind its motion against the stars.
  const d = skyDirToScreen(o.vx, o.vy);
  const len = Math.hypot(d.x, d.y) || 1;
  const tx = -d.x / len, ty = -d.y / len;
  ctx.fillStyle = col;
  const a = ctx.globalAlpha;
  const n = o.tailJitter.length;
  for (let i = 0; i < n; i++) {
    const k = (i + 1) / n;
    const dist = r * 1.6 * (i + 1);
    const j = o.tailJitter[i] * r * 0.6 * k;   // fuzzy sideways scatter
    const x = s.x + tx * dist - ty * j;
    const y = s.y + ty * dist + tx * j;
    const sz = Math.max(1, r * 0.9 * (1 - k * 0.6));
    ctx.globalAlpha = a * 0.55 * (1 - k);
    ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
  }
  // faint coma, then nucleus
  ctx.globalAlpha = a * 0.18;
  ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.4, 0, TAU); ctx.fill();
  ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); ctx.fill();
}

function drawNeo(o, s, r, col) {
  // Diamond core inside pulsing target brackets, labelled. Must be unmistakable.
  ctx.fillStyle = col;
  ctx.strokeStyle = col;
  ctx.beginPath();
  ctx.moveTo(s.x, s.y - r); ctx.lineTo(s.x + r * 0.75, s.y);
  ctx.lineTo(s.x, s.y + r); ctx.lineTo(s.x - r * 0.75, s.y);
  ctx.closePath();
  ctx.fill();
  const b = r * (2.1 + 0.25 * Math.sin(clock * 10));
  const k = r * 0.8;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const cx = s.x + sx * b, cy = s.y + sy * b;
    ctx.moveTo(cx, cy - sy * k); ctx.lineTo(cx, cy); ctx.lineTo(cx - sx * k, cy);
  }
  ctx.stroke();
  ctx.font = font(10, 700);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('NEO', s.x, s.y - b - 4);
}

function drawIso(o, s, r, col) {
  // Long, thin cigar shape pointing along its path, inside a turning dashed
  // ring, labelled. Different enough from the near-Earth object to read at a glance.
  const d = skyDirToScreen(o.vx, o.vy);
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.fillStyle = col;
  ctx.strokeStyle = col;
  ctx.save();
  ctx.rotate(Math.atan2(d.y, d.x));
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.5, r * 0.45, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  const ring = r * (2.3 + 0.2 * Math.sin(clock * 12));
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 5]);
  ctx.lineDashOffset = -clock * 30;
  ctx.beginPath();
  ctx.arc(0, 0, ring, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = font(10, 700);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('ISO', 0, -ring - 4);
  ctx.restore();
}

function drawStar(o, s, r, col) {
  // Flickering point with small diffraction spikes.
  const f = 0.5 + 0.3 * Math.sin(clock * TAU / o.flickerPeriod + o.flickerPhase)
                + 0.2 * Math.sin(clock * 17.3 + o.flickerPhase * 3);
  const a = ctx.globalAlpha;
  ctx.globalAlpha = a * clamp(0.35 + 0.65 * f, 0, 1);
  ctx.fillStyle = col;
  ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(s.x, s.y, r * (0.8 + 0.4 * f), 0, TAU); ctx.fill();
  const spike = r * (2.2 + 1.6 * f);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(s.x - spike, s.y); ctx.lineTo(s.x + spike, s.y);
  ctx.moveTo(s.x, s.y - spike); ctx.lineTo(s.x, s.y + spike);
  ctx.stroke();
  ctx.globalAlpha = a;
}

function drawObject(o) {
  const s = skyToScreen(o.x, o.y);
  const r = sizePx(TYPE_CFG[o.type]);
  const col = stateColor(o);

  drawArcTrail(o, s, r);

  ctx.save();
  ctx.globalAlpha = o.alpha * (o.state === 'linked' ? 1 - o.fade : 1);
  ctx.shadowColor = col;
  ctx.shadowBlur = o.state === 'ready' ? 10 + 6 * Math.sin(clock * 8) : 8;
  if (o.type === 'mainBelt') drawMainBelt(o, s, r, col);
  else if (o.type === 'comet') drawComet(o, s, r, col);
  else if (o.type === 'neo') drawNeo(o, s, r, col);
  else if (o.type === 'iso') drawIso(o, s, r, col);
  else if (o.type === 'star') drawStar(o, s, r, col);
  ctx.restore();

  // Ring pulse on tag / turning blue, and an expanding ring on link.
  if (o.flash > 0 || o.state === 'linked') {
    const p = o.state === 'linked' ? o.fade : 1 - o.flash;
    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = (1 - p) * 0.8;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r + 4 + p * (o.state === 'linked' ? 36 : 18), 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  if (CONFIG.debugTapRadius) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(s.x, s.y, tapRadiusPx(), 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

// Pulsing arrow at the screen edge where the near-Earth object will enter.
function drawNeoWarnings() {
  for (const neo of night.criticals) {
    if (!neo.path || night.t > neo.arrive + 0.4) continue;
    const pad = 22;
    const x = clamp(neo.path.ex * W, pad + safe.left, W - pad - safe.right);
    const y = clamp(neo.path.ey * W, pad + safe.top, H - pad - safe.bottom);
    const ang = Math.atan2(neo.path.uy, neo.path.ux);
    const pulse = 0.5 + 0.5 * Math.sin(clock * 14);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.strokeStyle = C.white;
    ctx.fillStyle = C.white;
    ctx.shadowColor = C.white;
    ctx.shadowBlur = 12;
    ctx.globalAlpha = 0.5 + 0.5 * pulse;
    ctx.lineWidth = 2;
    for (let i = 0; i < 2; i++) {           // double chevron pointing along its path
      const o = i * 8;
      ctx.beginPath();
      ctx.moveTo(-6 + o, -8); ctx.lineTo(2 + o, 0); ctx.lineTo(-6 + o, 8);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, 16 + pulse * 4, 0, TAU);
    ctx.globalAlpha *= 0.5;
    ctx.stroke();
    ctx.restore();
  }
}

function drawPopups() {
  ctx.save();
  ctx.font = font(15, 700);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.blue;
  ctx.shadowColor = C.blue;
  ctx.shadowBlur = 8;
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / 1.1;
    ctx.fillText(p.text, p.x, p.y - 18 - p.t * 30);
  }
  ctx.restore();
}

function drawHud() {
  const top = safe.top + 14;
  const big = clamp(W * 0.06, 22, 34);
  ctx.save();
  ctx.textBaseline = 'top';
  ctx.fillStyle = C.white;
  ctx.shadowColor = 'rgba(232,236,245,0.5)';
  ctx.shadowBlur = 8;

  // Top left: time left in the night.
  ctx.textAlign = 'left';
  ctx.globalAlpha = 0.55;
  ctx.font = font(11);
  ctx.fillText(`NIGHT ${night.number}`, safe.left + 16, top);
  ctx.globalAlpha = 1;
  ctx.font = font(big, 700);
  ctx.fillText(String(Math.max(0, Math.ceil(CONFIG.nightLength - night.t))), safe.left + 16, top + 15);

  // Top right: score.
  ctx.textAlign = 'right';
  ctx.globalAlpha = 0.55;
  ctx.font = font(11);
  ctx.fillText('SCORE', W - safe.right - 16, top);
  ctx.globalAlpha = 1;
  ctx.font = font(big, 700);
  ctx.fillText(String(run.score + stats.score), W - safe.right - 16, top + 15);

  // Under the score: health, as diamonds (the near-Earth object's shape).
  drawHealth(W - safe.right - 16, top + 15 + big + 12);

  // Centre: banners.
  ctx.textAlign = 'center';
  ctx.font = font(clamp(W * 0.032, 12, 16), 700);
  let by = top + 62;
  for (const b of banners) {
    const fadeOut = clamp((b.dur - b.t) / 0.4, 0, 1);
    const blink = b.text.endsWith('INBOUND') ? 0.55 + 0.45 * Math.sin(clock * 14) : 1;
    ctx.globalAlpha = fadeOut * blink;
    ctx.fillText(b.text, W / 2, by);
    by += 22;
  }
  ctx.restore();

  drawBuffer();
}

// Health pips, right-aligned to x. Lost health is an outline; the pip just
// lost flashes red.
function drawHealth(xRight, y) {
  const r = 5, gap = 15;
  ctx.save();
  ctx.lineWidth = 1.5;
  for (let i = 0; i < CONFIG.maxHealth; i++) {
    const x = xRight - r - (CONFIG.maxHealth - 1 - i) * gap;
    const full = i < run.health;
    const justLost = i === run.health && damageFlash > 0;
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.75, y);
    ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.75, y);
    ctx.closePath();
    if (full) {
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.white;
      ctx.shadowColor = C.white;
      ctx.shadowBlur = 6;
      ctx.fill();
    } else {
      ctx.shadowBlur = 0;
      ctx.globalAlpha = justLost ? 0.4 + 0.6 * damageFlash : 0.4;
      ctx.strokeStyle = justLost ? C.red : C.white;
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Red glow around the screen edge when health is lost.
function drawDamageFlash() {
  if (damageFlash <= 0) return;
  ctx.save();
  ctx.globalAlpha = damageFlash * 0.7;
  ctx.strokeStyle = C.red;
  ctx.shadowColor = C.red;
  ctx.shadowBlur = 40;
  ctx.lineWidth = 14;
  ctx.strokeRect(0, 0, W, H);
  ctx.restore();
}

// The alert buffer: a row of pips near the bottom.
function drawBuffer() {
  const n = slots.length;
  const pr = 9, gap = 30;
  const y = H - safe.bottom - 34;
  const shake = Math.sin(clock * 70) * 7 * pipShake;
  const x0 = W / 2 - (n - 1) * gap / 2 + shake;
  ctx.save();
  for (let i = 0; i < n; i++) {
    const o = slots[i];
    const x = x0 + i * gap;
    ctx.beginPath();
    ctx.arc(x, y, pr, 0, TAU);
    if (!o) {
      ctx.globalAlpha = 0.45 + 0.55 * pipShake;
      ctx.strokeStyle = C.white;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 0;
      ctx.stroke();
    } else {
      const col = o.state === 'ready' ? C.blue : C.yellow;
      ctx.globalAlpha = o.state === 'ready' ? 0.75 + 0.25 * Math.sin(clock * 8) : 1;
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 10;
      ctx.fill();
    }
  }

  // How-to hints, until the first link.
  if (CONFIG.showHints && hintStage < 3) {
    const text = ['tap a moving object to tag it', 'wait for it to turn blue', 'tap blue to link it'][hintStage];
    ctx.globalAlpha = 0.6;
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.white;
    ctx.font = font(13, 500);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(text, W / 2, y - pr - 14);
  }
  ctx.restore();
}

function render() {
  drawSky();
  if (mode !== 'playing' && mode !== 'paused') return;
  for (const o of objects) drawObject(o);
  drawNeoWarnings();
  drawPopups();
  drawDamageFlash();
  drawHud();
}


/* ==========================================================================
   SCREENS
   ========================================================================== */
const titleEl = document.getElementById('title');
const pauseEl = document.getElementById('pause');
const pauseBtn = document.getElementById('pauseBtn');
const muteBtn = document.getElementById('muteBtn');
const soundBtn = document.getElementById('soundBtn');

// The pause and mute buttons show only during play.
function setHudButtons(show) {
  pauseBtn.classList.toggle('hidden', !show);
  muteBtn.classList.toggle('hidden', !show);
}

// In-game mute: the speaker button and the pause-menu toggle do the same thing.
function setMuted(m) {
  Sound.setMuted(m);
  muteBtn.classList.toggle('muted', m);
  muteBtn.setAttribute('aria-label', m ? 'Unmute' : 'Mute');
  soundBtn.textContent = m ? 'SOUND: OFF' : 'SOUND: ON';
}
const aboutEl = document.getElementById('about');
const summaryEl = document.getElementById('summary');
const summaryPanel = document.getElementById('summaryPanel');

// Health as diamonds for the HTML screens: filled for health left.
function healthHtml() {
  let h = '';
  for (let i = 0; i < CONFIG.maxHealth; i++) h += i < run.health ? '◆' : '<span class="lost">◇</span>';
  return `<span class="health">${h}</span>`;
}

// Shared bottom of both screens: the main button, then the About link.
// The button waits a moment so a frantic last tap doesn't skip the screen.
function screenButton(label, onClick) {
  return {
    html: `<button id="nextBtn" disabled>${label}</button><br><a class="about-link" data-about>ABOUT</a>`,
    wire() {
      const btn = document.getElementById('nextBtn');
      setTimeout(() => { btn.disabled = false; }, 800);
      btn.addEventListener('click', onClick);
    },
  };
}

// End of a night that was survived.
function showSummary() {
  const s = stats;
  // "caught" / "missed" for a single one, "2 / 3" for several.
  const tally = (caught, total) => total === 1
    ? (caught ? `<span class="caught">caught</span>` : `<span class="missed">missed</span>`)
    : `${caught} / ${total}`;
  const total = night.criticals.filter(c => c.type === 'neo').length;
  const isoTotal = night.criticals.filter(c => c.type === 'iso').length;
  const critical = tally(s.neoCaught, total);
  const isoRow = isoTotal
    ? `<tr><td>Interstellar object</td><td class="n">${tally(s.isoCaught, isoTotal)}</td><td class="pts">${s.linked.iso * CONFIG.iso.points}</td></tr>`
    : '';
  const next = screenButton('CONTINUE', () => startNight(night.number + 1));
  summaryPanel.innerHTML = `
    <div class="label">NIGHT ${night.number} COMPLETE</div>
    <div class="score">${s.score}</div>
    <table>
      <tr><td>Asteroids linked</td><td class="n">${s.linked.mainBelt}</td><td class="pts">${s.linked.mainBelt * CONFIG.mainBelt.points}</td></tr>
      <tr><td>Comets linked</td><td class="n">${s.linked.comet}</td><td class="pts">${s.linked.comet * CONFIG.comet.points}</td></tr>
      <tr><td>Near-Earth object${total === 1 ? '' : 's'}</td><td class="n">${critical}</td><td class="pts">${s.linked.neo * CONFIG.neo.points}</td></tr>
      ${isoRow}
      <tr class="gap bad"><td>Lost arcs</td><td class="n">${s.lost}</td></tr>
      <tr class="bad"><td>Stars tagged</td><td class="n">${s.starsTagged}</td></tr>
      <tr class="gap"><td>Health${s.restored ? ` <span class="restored">+${s.restored} clean night</span>` : ''}</td><td class="n">${healthHtml()}</td></tr>
      <tr><td>Total score</td><td class="n">${run.score}</td></tr>
    </table>
    ${next.html}`;
  summaryEl.classList.remove('hidden');
  next.wire();
}

// Health ran out.
function showGameOver() {
  const survived = run.nightsCompleted;
  const again = screenButton('PLAY AGAIN', startRun);
  summaryPanel.innerHTML = `
    <div class="label">GAME OVER</div>
    <div class="score">${survived}</div>
    <div class="label">NIGHT${survived === 1 ? '' : 'S'} CATALOGED</div>
    <table class="spaced">
      <tr><td>Points</td><td class="n">${run.score}</td></tr>
      <tr><td>Near-Earth objects caught</td><td class="n">${run.neoCaught}</td></tr>
      <tr class="bad"><td>Near-Earth objects missed</td><td class="n">${run.neoMissed}</td></tr>
      ${run.isoCaught + run.isoMissed ? `
      <tr><td>Interstellar objects caught</td><td class="n">${run.isoCaught}</td></tr>
      <tr class="bad"><td>Interstellar objects missed</td><td class="n">${run.isoMissed}</td></tr>` : ''}
    </table>
    ${again.html}`;
  summaryEl.classList.remove('hidden');
  again.wire();
}

titleEl.addEventListener('click', () => {
  Sound.unlock();
  startRun();
});

// Pause menu.
pauseBtn.addEventListener('click', pauseGame);
muteBtn.addEventListener('click', () => { Sound.unlock(); setMuted(!Sound.muted); });
soundBtn.addEventListener('click', () => setMuted(!Sound.muted));
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
// Restart abandons the whole run and goes back to the start screen.
document.getElementById('restartBtn').addEventListener('click', goToTitle);
// Leaving the tab or locking the phone pauses the night.
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

// About screen: opens on top of the start or summary screen; BACK closes it.
// Any element with a data-about attribute opens it (the summary is rebuilt
// each night, so this listens on the whole page).
document.addEventListener('click', e => {
  if (e.target.closest('[data-about]')) {
    e.stopPropagation();          // don't also start the night from the title screen
    aboutEl.classList.remove('hidden');
    aboutEl.scrollTop = 0;
  }
}, true);
document.getElementById('aboutClose').addEventListener('click', () => aboutEl.classList.add('hidden'));


/* ==========================================================================
   INPUT
   Pointer events cover mouse, touch and pen with one code path.
   ========================================================================== */
canvas.addEventListener('pointerdown', e => {
  if (mode !== 'playing') return;
  e.preventDefault();
  Sound.unlock();          // cheap; wakes audio if the phone suspended it
  handleTap(e.clientX, e.clientY);
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());   // iOS pinch zoom


/* ==========================================================================
   FRAME LOOP
   Uses elapsed time, so speed is the same at 60 Hz, 120 Hz or a slow phone.
   ========================================================================== */
let last = performance.now();
function frame(now) {
  // Cap the step so a stall or a background tab doesn't jump the game ahead.
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  clock += dt;
  if (mode !== 'paused') {
    updateCamera(dt);
    updateFieldStars();
  }
  if (mode === 'playing') updateNight(dt);
  render();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
